name: Update official member directory

# ⚠️ 定时更新已停用（2026-11-07）
# ---------------------------------------------------------------------------
# GitHub Actions 出口 IP（Azure 机房段）请求 pocketapi.48.cn 恒返回 403，
# 与 member-db-sync 同一个坑：加 UA / Referer 均无效。
# 2026-11-03 ~ 11-07 连续 5 天 schedule 失败，日志只有「官方接口 HTTP 403」。
# 官方成员快照改由境内网络手动执行 fetch-official.mjs 后提交；需要时可在
# 能访问官方接口的环境跑 workflow_dispatch（本机/境内机），别再挂 schedule。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node member-db/fetch-official.mjs
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add member-db/official/members.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(member-db): update official member directory'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
