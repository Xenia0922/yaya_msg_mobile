name: Update official member directory

on:
  workflow_dispatch:
  schedule:
    - cron: '31 20 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node member-db/fetch-official.mjs
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add member-db/official/members.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(member-db): update official member directory'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
