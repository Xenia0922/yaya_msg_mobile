name: Update official member directory

# 定时更新已停用：GitHub Actions 的出口 IP 请求官方接口会被网关拒绝。
# 需要更新官方成员快照时，在可正常访问官方接口的网络环境中手动触发本 workflow。
# schedule 保持关闭，避免连续失败。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node member-db/fetch-official.mjs
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add member-db/official/members.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(member-db): update official member directory'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
