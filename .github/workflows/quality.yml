name: Quality

on:
  push:
    # public 为日常开发与发布主分支，plus / public-* 为历史或特性分支
    branches: [main, public, plus, 'public-*']
  pull_request:
    branches: [main, public, plus, 'public-*']

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck and version gate
        run: npm run typecheck

      - name: Core tests
        run: npm run test:core

      - name: Static checks
        run: npm run check

      - name: Diff check
        run: git diff --check
