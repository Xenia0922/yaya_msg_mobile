name: Android APK

# 云打包：不再占用本地机器（本地全量 4 ABI + Compose dexing 约 15 分钟）。
# 手动触发：Actions → Android APK → Run workflow（可选 ABI）。
# 也可以在 push 到下面这些分支时自动出包。
on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABI 列表（逗号分隔：x86_64 / arm64-v8a / armeabi-v7a）'
        required: true
        default: 'x86_64'
      universal:
        description: '是否额外打 universal 包（体积大、慢）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Accept licenses & preinstall NDK / build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" > /dev/null 2>&1 || true

      - name: Install deps
        run: npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Assemble release APK
        working-directory: android
        env:
          NODE_ENV: production
          # 未提供 RELEASE_* 密钥时 build.gradle 会退回 debug 签名（仅用于测试装机）
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -Pyaya.abis="${{ github.event.inputs.abis }}" \
            -Pyaya.universal="${{ github.event.inputs.universal }}" \
            -Dorg.gradle.parallel=false \
            --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaya-msg-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 14
