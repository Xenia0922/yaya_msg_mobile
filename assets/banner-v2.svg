<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b0d16"/>
      <stop offset="48%" stop-color="#3d1630"/>
      <stop offset="100%" stop-color="#131326"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6f91" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#ff6f91" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff6f91" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6f91"/>
      <stop offset="100%" stop-color="#ff9db6"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="260" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <ellipse cx="1010" cy="10" rx="360" ry="300" fill="url(#glowPink)"/>
    <ellipse cx="120" cy="290" rx="320" ry="240" fill="url(#glowViolet)"/>

    <!-- 右侧玻璃卡片组（聊天 / 气泡意象） -->
    <g transform="translate(806 44) rotate(-8 160 86)">
      <rect x="0" y="34" width="300" height="74" rx="20" fill="#ffffff" fill-opacity="0.045" stroke="url(#glassStroke)" stroke-width="1"/>
      <rect x="18" y="52" width="120" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.20"/>
      <rect x="18" y="72" width="196" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.10"/>
    </g>
    <g transform="translate(846 100) rotate(-8 160 86)">
      <rect x="0" y="0" width="286" height="70" rx="20" fill="#ff6f91" fill-opacity="0.14" stroke="#ff6f91" stroke-opacity="0.35" stroke-width="1"/>
      <rect x="18" y="18" width="96" height="9" rx="4.5" fill="#ff9db6" fill-opacity="0.65"/>
      <rect x="18" y="38" width="162" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.18"/>
    </g>
    <circle cx="1128" cy="196" r="7" fill="#ff9db6" fill-opacity="0.85"/>
    <circle cx="1102" cy="212" r="4" fill="#ff9db6" fill-opacity="0.45"/>

    <!-- 文案 -->
    <text x="64" y="104" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="2">牙牙消息</text>
    <text x="66" y="136" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#ff9db6" letter-spacing="6">YAYA MESSAGE</text>
    <text x="66" y="176" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" fill="#ffffff" fill-opacity="0.68">口袋48 第三方移动客户端 · React Native</text>

    <!-- 版本胶囊 + 兼容说明 -->
    <g>
      <rect x="64" y="196" width="96" height="32" rx="16" fill="#ff6f91" fill-opacity="0.16" stroke="#ff6f91" stroke-opacity="0.45" stroke-width="1"/>
      <text x="112" y="217" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#ff9db6">v2.7.6</text>
      <text x="176" y="217" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.42">鸿蒙 2/3/4 · Android 8.0+</text>
    </g>

    <rect x="64" y="244" width="150" height="5" rx="2.5" fill="url(#pink)"/>
  </g>
</svg>
